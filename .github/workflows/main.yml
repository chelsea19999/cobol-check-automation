
name: COBOL Check Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cobol-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Step 3: Install Zowe CLI
      - name: Install Zowe CLI
        run: |
          npm install -g @zowe/cli
          zowe --version

      # Step 4: Configure IBM Z Xplore connection
      - name: Configure IBM Z Xplore
        env:
          ZOWE_USERNAME: ${{ secrets.ZOWE_USERNAME }}
          ZOWE_PASSWORD: ${{ secrets.ZOWE_PASSWORD }}
          ZOWE_HOST: ${{ secrets.ZOWE_HOST }}
          ZOWE_PORT: ${{ secrets.ZOWE_PORT }}
        run: |
          if [ -z "$ZOWE_HOST" ]; then
            echo "ERROR: ZOWE_HOST is missing"
            exit 1
          fi

          if [ -z "$ZOWE_USERNAME" ] || [ -z "$ZOWE_PASSWORD" ]; then
            echo "ERROR: Zowe credentials are missing"
            exit 1
          fi

          zowe profiles create zosmf zxplore \
            --host "$ZOWE_HOST" \
            --port "$ZOWE_PORT" \
            --user "$ZOWE_USERNAME" \
            --password "$ZOWE_PASSWORD" \
            --reject-unauthorized false

          echo "Zowe profile created successfully."

      # Step 5: Test z/OSMF connection
      - name: Test IBM Z Xplore connection
        run: |
          echo "Testing connection to IBM Z Xplore..."

          zowe zosmf check status \
            --zosmf-profile zxplore

          echo "Connection test completed."
